# Dependabot — weekly dependency updates for edu-lab.
# Covers GitHub Actions and Terraform.
#
# npm is intentionally OMITTED: this is a no-build site with no package.json,
# and Dependabot does NOT skip ecosystems with a missing manifest — it fails
# the whole "npm_and_yarn" update job every week with
# `dependency_file_not_found: /package.json not found`. If a package.json is
# ever added at the repo root, re-add an npm ecosystem block here in the same
# PR. (Dependabot *security* updates are a repo setting and are unaffected by
# this file.)
version: 2
updates:
  # GitHub Actions used in .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"

  # Terraform providers/modules under terraform/
  - package-ecosystem: "terraform"
    directory: "/terraform"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "terraform"
